seed: -1
task: 'biped_s45_no_vision'
print_config: False
rl_device: 'cuda:0'
sim_device: 'cuda:0'
graphics_device: 'cuda:0'
headless: False
logdir: 'default'
multi_gpu: False
multi_gpu_global_rank: 0
multi_gpu_local_rank: 0
multi_gpu_world_size: 1
master_addr: '127.0.0.1'

env:
  num_envs: 2048
  send_timeouts: True # For value bootstrap.
  episode_length_s: 40.

  force_renderer: False
  camera_params:
    # Different realsense intrinsics: https://pastebin.com/fRwwuBmd
    # 69.95 x 43.18 FOV
    cam_width: 424
    cam_height: 240
    fl_x: 303.042358398438
    fl_y: 303.17578125
    pp_x: 213.575500488281
    pp_y: 124.642997741699

    # How much to downscale the image (and intrinsics) by.
    downscale_factor: 5.0

    # Cam offset relative to `asset.camera_link_name`.
    cam_xyz_offset: [0., 0., 0.]
    # 奇怪参数，第二个控制的是yaw，第三个是roll，第一个也是roll？
    cam_rpy_offset: [1.571, 1.571, 3.142]

observations:
  # image_encoder:
  #   add_noise: True
  #   add_latency: True
  #   latency_resampling_interval_s: 3.0
  #   observations: [
  #     CAMERA_IMAGE, PROJECTED_GRAVITY, DOF_POS #, DOF_VEL, ACTIONS
  #   ]
  critic:
    observations: [
        BASE_LIN_VEL,
        BASE_ANG_VEL,
        PROJECTED_GRAVITY,
        GAIT_PROGRESS,
        VELOCITY_COMMANDS,
        DOF_POS,
        DOF_VEL,
        ACTIONS,
        RAY_CAST,
        BASE_MASS_SCALED,
        PUSHING_FORCES,
        PUSHING_TORQUES,
        BASE_HEIGHT,
        FEET_AIR_TIME,
        FEET_CONTACT_TIME,
        FEET_CONTACT,
        STIFFNESS,
        DAMPING,
        MOTOR_STRENGTH,
        MOTOR_ERROR,
        # IMAGE_ENCODER_LATENT
      ]
  policy:
    add_noise: True
    add_latency: True
    latency_resampling_interval_s: 3.0
    observations: [
        BASE_ANG_VEL,
        PROJECTED_GRAVITY,
        GAIT_PROGRESS,
        VELOCITY_COMMANDS,
        DOF_POS,
        DOF_VEL,
        ACTIONS,
        # IMAGE_ENCODER_LATENT
      ]
    sync_latency:
      [BASE_ANG_VEL, PROJECTED_GRAVITY, VELOCITY_COMMANDS, DOF_POS, DOF_VEL]

terrain:
  scene_root: '{GAUSS_GYM_ROOT_DIR}/scenes'
  cams_yaw_only: False
  static_friction: 1.0
  dynamic_friction: 1.0
  restitution: 0.
  num_mesh_repeats: 1

  scenes:
    max_num_scenes: 10
    iphone_data:
      class_name: GaussGymData
      split_frac: 1.0
      repo_id: 'escontra/gauss_gym_data'
      scene: 'amazon_stairs'
    grand_tour:
      class_name: GrandTourData
      split_frac: 0.0
      mission: ''
    arkit:
      class_name: ARKitData
      split_frac: 0.0
      split: 'Training'

init_state:
  pos: [0.0, 0.0, 0.9]
  rot: [0.0, 0.0, 0.0, 1.0]
  lin_vel: [0.0, 0.0, 0.0]
  ang_vel: [0.0, 0.0, 0.0]
  default_joint_angles: # = target angles [rad] when action = 0.0
    leg_l1_joint: 0.0
    leg_l2_joint: 0.0
    leg_l3_joint: -0.27
    leg_l4_joint: 0.52
    leg_l5_joint: -0.3
    leg_l6_joint: 0.0
    leg_r1_joint: 0.0
    leg_r2_joint: 0.0
    leg_r3_joint: -0.27
    leg_r4_joint: 0.52
    leg_r5_joint: -0.3
    leg_r6_joint: 0.0
    zarm_l1_joint: 0.0
    zarm_l2_joint: 0.0
    zarm_l3_joint: 0.0
    zarm_l4_joint: 0.0
    zarm_l5_joint: 0.0
    zarm_l6_joint: 0.0
    zarm_l7_joint: 0.0
    zarm_r1_joint: 0.0
    zarm_r2_joint: 0.0
    zarm_r3_joint: 0.0
    zarm_r4_joint: 0.0
    zarm_r5_joint: 0.0
    zarm_r6_joint: 0.0
    zarm_r7_joint: 0.0
    # Keep head fixed, slightly pitched down. Adjust sign/magnitude if needed.
    zhead_1_joint: 0.0
    zhead_2_joint: 0.0

control:
  control_type: P
  # Exclude these DOFs from the policy action vector; they will be held at
  # their default_joint_angles (since action=0 targets default_dof_pos).
  exclude_action_dof_names: ['zhead_1_joint', 'zhead_2_joint']
  stiffness: # [N*m/rad]
  # 踝关节： 并联参数 
    leg_l1_joint: 35
    leg_r1_joint: 35
    leg_l2_joint: 35
    leg_r2_joint: 35
    leg_l3_joint: 60
    leg_r3_joint: 60
    leg_l4_joint: 100
    leg_r4_joint: 100.0
    leg_l5_joint: 8
    leg_r5_joint: 8
    leg_l6_joint: 8
    leg_r6_joint: 8
    zarm_l1_joint: 30.0
    zarm_r1_joint: 30.0
    zarm_l2_joint: 30.0
    zarm_r2_joint: 30.0
    zarm_l3_joint: 30.0
    zarm_r3_joint: 30.0
    zarm_l4_joint: 20.0
    zarm_r4_joint: 20.0
    zarm_l5_joint: 10.0
    zarm_r5_joint: 10.0
    zarm_l6_joint: 10.0
    zarm_r6_joint: 10.0
    zarm_l7_joint: 10.0
    zarm_r7_joint: 10.0
    zhead_1_joint: 10.0
    zhead_2_joint: 10.0
  damping: # [N*m/rad]  # [N*m*s/rad]
    leg_l1_joint: 4.0
    leg_r1_joint: 4.0
    leg_l2_joint: 4.0
    leg_r2_joint: 4.0
    leg_l3_joint: 5.0
    leg_r3_joint: 5.0
    leg_l4_joint: 6.0
    leg_r4_joint: 6.0
    leg_l5_joint: 3.0
    leg_r5_joint: 3.0
    leg_l6_joint: 3.0
    leg_r6_joint: 3.0
    zarm_l1_joint: 3.0
    zarm_r1_joint: 3.0
    zarm_l2_joint: 3.0
    zarm_r2_joint: 3.0
    zarm_l3_joint: 3.0
    zarm_r3_joint: 3.0
    zarm_l4_joint: 3.0
    zarm_r4_joint: 3.0
    zarm_l5_joint: 3.0
    zarm_r5_joint: 3.0
    zarm_l6_joint: 3.0
    zarm_r6_joint: 3.0
    zarm_l7_joint: 3.0
    zarm_r7_joint: 3.0
    zhead_1_joint: 1.0
    zhead_2_joint: 1.0
  # Per-joint actuator limits (used to override URDF DOF properties and torque clipping).
  effort_limit:
    leg_l1_joint: 180.0
    leg_r1_joint: 180.0
    leg_l2_joint: 100.0
    leg_r2_joint: 100.0
    leg_l3_joint: 100.0
    leg_r3_joint: 100.0
    leg_l4_joint: 180.0
    leg_r4_joint: 180.0
    leg_l5_joint: 72.0
    leg_r5_joint: 72.0
    leg_l6_joint: 36.0
    leg_r6_joint: 36.0
    zarm_l1_joint: 100.0
    zarm_r1_joint: 100.0
    zarm_l2_joint: 50.0
    zarm_r2_joint: 50.0
    zarm_l3_joint: 36.0
    zarm_r3_joint: 36.0
    zarm_l4_joint: 50.0
    zarm_r4_joint: 50.0
    zarm_l5_joint: 12.0
    zarm_r5_joint: 12.0
    zarm_l6_joint: 12.0
    zarm_r6_joint: 12.0
    zarm_l7_joint: 12.0
    zarm_r7_joint: 12.0
  velocity_limit:
    leg_l1_joint: 14.0
    leg_r1_joint: 14.0
    leg_l2_joint: 23.0
    leg_r2_joint: 23.0
    leg_l3_joint: 23.0
    leg_r3_joint: 23.0
    leg_l4_joint: 14.0
    leg_r4_joint: 14.0
    leg_l5_joint: 10.0
    leg_r5_joint: 10.0
    leg_l6_joint: 10.0
    leg_r6_joint: 10.0
    zarm_l1_joint: 23.0
    zarm_r1_joint: 23.0
    zarm_l2_joint: 23.0
    zarm_r2_joint: 23.0
    zarm_l3_joint: 23.0
    zarm_r3_joint: 23.0
    zarm_l4_joint: 23.0
    zarm_r4_joint: 23.0
    zarm_l5_joint: 23.0
    zarm_r5_joint: 23.0
    zarm_l6_joint: 23.0
    zarm_r6_joint: 23.0
    zarm_l7_joint: 23.0
    zarm_r7_joint: 23.0
  decimation: 10
  computer_clip_torque: False
  motor_clip_torque: True
  clip_torque_scale: 1.0 # TODO(escontra): for sweep, remove.

asset:
  file: '{GAUSS_GYM_ROOT_DIR}/resources/robots/biped_s45/urdf/biped_s45_waist_cam.urdf'
  name: 'biped_s45'
  base_link_name: 'base_link'
  # Hip links (used by hip_height_raycaster). For this URDF, the hip joints are
  # leg_*1_joint, so the corresponding child links are leg_*1_link.
  hip_link_names: ['leg_l1_link', 'leg_r1_link']
  # Mount the camera on the waist camera link (exists in the waist-cam URDF).
  camera_link_name: 'waist_camera'
  # Prefer explicit foot rigid bodies (one body per foot).
  feet_names: ['leg_l6_link', 'leg_r6_link']
  # Fallback if feet_names is omitted.
  foot_name: 'leg_foot'
  penalize_contacts_on: ['base_link', 'zarm_', 'zhead_', 'zarm_', 'zhead_']
  terminate_after_contacts_on: ['base_link', 'zhead_']
  feet_edge_pos: [
      [0.1215, 0.05, -0.03],
      [0.1215, -0.05, -0.03],
      [-0.1015, 0.05, -0.03],
      [-0.1015, -0.05, -0.03],
    ] # x,y,z [m]
  feet_contact_radius: 0.01

  disable_joint_limits: False
  disable_gravity: False
  collapse_fixed_joints: False
  fix_base_link: False
  default_dof_drive_mode: 3
  self_collisions: 1
  replace_cylinder_with_capsule: True
  flip_visual_attachments: False

  density: 0.001
  angular_damping: 0.
  linear_damping: 0.
  max_angular_velocity: 1000.
  max_linear_velocity: 1000.
  armature: 0
  thickness: 0.01

  # Per-DOF armature values (applied when armature randomization is disabled).
  armature_map:
    leg_l1_joint: 0.05
    leg_r1_joint: 0.05
    leg_l2_joint: 0.025
    leg_r2_joint: 0.025
    leg_l3_joint: 0.025
    leg_r3_joint: 0.025
    leg_l4_joint: 0.05
    leg_r4_joint: 0.05
    leg_l5_joint: 0.05
    leg_r5_joint: 0.05
    leg_l6_joint: 0.05
    leg_r6_joint: 0.05
    zarm_l1_joint: 0.025
    zarm_r1_joint: 0.025
    zarm_l2_joint: 0.02
    zarm_r2_joint: 0.02
    zarm_l3_joint: 0.02
    zarm_r3_joint: 0.02
    zarm_l4_joint: 0.02
    zarm_r4_joint: 0.02
    zarm_l5_joint: 0.01
    zarm_r5_joint: 0.01
    zarm_l6_joint: 0.01
    zarm_r6_joint: 0.01
    zarm_l7_joint: 0.01
    zarm_r7_joint: 0.01

domain_rand:
  apply_domain_rand: True

  camera_refresh_interval_s: 3.0
  # Refresh duration. How often the camera image is refreshed.
  # Not to be confused with the sythetic refresh_duration used in
  # observation_manager.
  refresh_duration:
    apply: True
    range: [0.05, 0.15]
    operation: 'additive'
    distribution: 'uniform'
  focal_length:
    apply: True
    range: [0.0, 3.0]
    operation: 'additive'
    distribution: 'gaussian'
  principal_point:
    apply: True
    range: [0.0, 1.0]
    operation: 'additive'
    distribution: 'gaussian'
  camera_pos:
    apply: True
    range: [-0.02, 0.02]
    operation: 'additive'
    distribution: 'uniform'
  camera_rot:
    apply: True
    range: [-0.03, 0.03]
    operation: 'additive'
    distribution: 'uniform'

  init_dof_pos:
    apply: True
    range: [0.0, 0.05]
    operation: 'additive'
    distribution: 'gaussian'
  init_base_lin_vel_xy:
    apply: True
    range: [0.0, 0.1]
    operation: 'additive'
    distribution: 'gaussian'
  init_base_yaw:
    apply: False
    range: [0.0, 1.5]
    operation: 'additive'
    distribution: 'gaussian'

  base_com_x:
    apply: True
    range: [-0.1, 0.1]
    operation: 'additive'
    distribution: 'uniform'
  base_com_y:
    apply: True
    range: [-0.1, 0.1]
    operation: 'additive'
    distribution: 'uniform'
  base_com_z:
    apply: True
    range: [-0.1, 0.1]
    operation: 'additive'
    distribution: 'uniform'
  base_mass:
    apply: True
    range: [0.8, 1.2]
    operation: 'scaling'
    distribution: 'uniform'
  other_com:
    apply: True
    range: [-0.005, 0.005]
    operation: 'additive'
    distribution: 'uniform'
  other_mass:
    apply: True
    range: [0.9, 1.1]
    operation: 'scaling'
    distribution: 'uniform'

  motor_strength:
    apply: True
    range: [0.8, 1.2]
    operation: 'scaling'
    distribution: 'uniform'
  motor_error:
    apply: True
    range: [-0.03, 0.03]
    operation: 'additive'
    distribution: 'uniform'

  dof_stiffness:
    apply: True
    range: [0.9, 1.1]
    operation: 'scaling'
    distribution: 'uniform'
  dof_damping:
    apply: True
    range: [0.9, 1.1]
    operation: 'scaling'
    distribution: 'uniform'
  dof_damping_ankles:
    apply: False
    ankle_names:
      [
        'Left_Ankle_Pitch',
        'Right_Ankle_Pitch',
        'Left_Ankle_Roll',
        'Right_Ankle_Roll',
      ]
    range: [-0.5, 2.0]
    operation: 'additive'
    distribution: 'uniform'
  dof_friction:
    apply: True
    range: [0.0, 2.0]
    operation: 'additive'
    distribution: 'uniform'
  dof_friction_ig_property:
    apply: True
    range: [0.0, 0.01]
    operation: 'additive'
    distribution: 'uniform_buckets'
    buckets: 255
  dof_armature_ig_property:
    apply: False
    range: [0.0, 0.015]
    operation: 'additive'
    distribution: 'uniform'

  foot_friction:
    apply: True
    range: [0.3, 2.0]
    operation: 'additive'
    distribution: 'uniform'
  foot_compliance:
    apply: True
    range: [0.5, 1.5]
    operation: 'additive'
    distribution: 'uniform'
  foot_restitution:
    apply: True
    range: [0.1, 0.9]
    operation: 'additive'
    distribution: 'uniform'

  kick_interval_s: 4.0
  kick_lin_vel:
    apply: True
    range: [-1.5, 1.5]
    operation: 'additive'
    distribution: 'uniform'
  kick_ang_vel:
    apply: True
    range: [-1.5, 1.5]
    operation: 'additive'
    distribution: 'uniform'

  push_interval_s: 8.0
  push_duration_s: 1.0
  push_force:
    apply: True
    range: [0., 10.]
    operation: 'additive'
    distribution: 'gaussian'
  push_torque:
    apply: True
    range: [0., 2.]
    operation: 'additive'
    distribution: 'gaussian'

termination:
  base_height_threshold: 0.45
  projected_gravity_z_threshold: 0.0

commands:
  name: 'velocity'

  command_gains: False
  command_gains_stiffness_range: [0.8, 1.2]
  command_gains_damping_range: [0.8, 1.2]
  gait_frequency: [0.8, 1.2]

  velocity:
    use_ground_positions: True
    lin_vel_range: [0., 0.7]
    ang_vel_yaw_range: [-1, 1]

    max_traj_pos_distance: 1.0
    max_traj_yaw_distance_rad: 6.28
    still_proportion: 0.0

    resampling_time: 4.

    small_lin_vel_threshold: 0.0
    small_ang_vel_threshold: 0.0

    success_on_loop: False
    truncate_on_success: True

  goal:
    goal_window_s: [10.0, 20.0]
    use_ground_positions: True

    goal_xyz: False
    goal_distance: 5.0
    goal_evaluation_time_s: 1.0
    goal_reached_pos_only: True
    goal_reached_pos_threshold: 0.25
    goal_reached_yaw_threshold: 0.5
    random_heading_goal: True

    distance_curriculum: True
    distance_schedule: [0.5, 10.0]
    completion_up_threshold: 0.7
    distance_up_amount: 0.5

rewards:
  only_positive_rewards: False
  scale_by_dt: False

  task:
    velocity:
      vel_tracking.scale: 15.0
      vel_tracking.tracking_sigma: 0.15
      yaw_vel_tracking.scale: 2.0
      yaw_vel_tracking.tracking_sigma: 0.2
    goal:
      pos_tracking.scale: 0.0
      yaw_tracking.scale: 0.0
      vel_tracking.scale: 0.0
      vel_tracking.tracking_sigma: 0.25
      yaw_vel_tracking.scale: 0.0
      yaw_vel_tracking.tracking_sigma: 0.25
      stand_at_target.scale: 0.0
      move_in_direction.scale: 0.0
      dont_wait.scale: 0.0
      dont_wait.vel_threshold: 0.1
  survival.scale: 0.0
  lin_vel_z.scale: -0.0
  ang_vel_xy.scale: -0.4
  orientation.scale: -1.5
  action_rate.scale: -0.02
  action_rate.use_action_mean: False
  action_smoothness_l2.scale: -0.01
  base_height.scale: 0.0
  base_height.height_target: 0.655
  s45_pose.scale: 0.0
  no_fly.scale: 0.0
  collision.scale: -1.0
  action_magnitude:
    scale: 0.0
    clip: 5.0
  penalty_foothold:
    scale: 0.0
    foothold_epsilon: 0.20
  dof_acc:
    scale: -2.e-6
    method: mean
  power.scale: -2.0e-5
  torques.scale: 0.0
  torques_main.scale: -1.0e-5
  torques_ankle.scale: -1.0e-5
  dof_pos_limits:
    scale: -0.5
    soft_dof_pos_limit: 0.9
  # 足部协调
  feet_air_time:
    scale: 3.0
    min_air_time: 0.5
    max_air_time: 1.4
  feet_contact_forces:
    scale: -0.0
    max_contact_force: 900
  feet_contact_without_cmd:
    scale: 0.0
    use_stance_mask: True
  no_feet_contact:
    scale: -1
    use_stance_mask: True
  feet_stumble:
    scale: -1.0
    multiplier: 3.0
  fly.scale: 0.0
  stand_still.scale: -1.0
  feet_clearance_height:
    scale: 0.5
    clearance_target: 0.14
    use_command_mask: True
  feet_swing:
    scale: 0.0
    swing_period: 0.6
  feet_distance.scale: 0.0
  feet_distance.close_feet_threshold: 0.10
  feet_splay.scale: 0.0
  feet_phase.scale: 1
  feet_phase.swing_height: 0.18
  feet_phase.track_rew: True
  stumble.scale: 0.0
  stumble.multiplier: 3.0
  feet_slip.scale: -0.1 # 减少滑动
  feet_slip.xy_only: True
  feet_splay.splay_threshold: 0.10



  joint_deviation_hip.scale: -0.0
  joint_deviation_arms.scale: -0.2
  undesired_contacts:
    scale: -0.5
    body_names:
      [
        'leg_l1_link', 'leg_l2_link', 'leg_l3_link', 'leg_l4_link', 'leg_l5_link',
        'leg_r1_link', 'leg_r2_link', 'leg_r3_link', 'leg_r4_link', 'leg_r5_link',
        'base_link', 'zarm_.*_link'
      ]
    threshold: 1.0

  illegal_dof_barrier.scale: -0.03
  termination.scale: -100.0
reward_penalty_curriculum:
  apply: True
  init_penalty_scale: 0.5
  min_penalty_scale: 0.1
  max_penalty_scale: 1.0
  min_episodes: 20
  completion_down_threshold: 0.3
  completion_up_threshold: 0.7
  percent_change: 0.05

  keys:
    [
      goal.stand_at_target,
      ang_vel_xy,
      orientation,
      action_rate,
      base_height,
      s45_pose,
    ]

normalization:
  filter_weight: 0.1

sim:
  physics_engine: 'SIM_PHYSX' # or "SIM_FLEX"
  dt: 0.002
  substeps: 1
  gravity: [0.0, 0.0, -9.81]
  up_axis: 1

  physx:
    num_subscenes: 0
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1.0
    max_gpu_contact_pairs: 16_777_216 # 2^24
    default_buffer_size_multiplier: 8.0
    contact_collection: 2

image_encoder:
  class_name: RecurrentCNNModel
  freeze_encoder: True
  obs_key: image_encoder
  reconstruct_observations:
    [critic/RAY_CAST, critic/BASE_ANG_VEL, critic/BASE_LIN_VEL]
  voxel_height_levels: 24
  num_updates_range: [1, 100]
  init_num_updates: 20
  num_steps_per_env: 10
  train_ratio_scheduler:
    warmup_steps: 100
    train_ratio_warmup: 1.0
    train_ratio_after: 0.1
  learning_rate_scheduler:
    warmup_steps: 100
    learning_rate_warmup: 1.e-4
    learning_rate_after: 5.e-5
  params:
    layer_activation: silu
    recurrent_state_size: 512
    recurrent_skip_connection: True
    hidden_layer_sizes: [512, 256, 256]
    symlog_inputs: True
    normalize_obs: True
    from_local: True
    model_type: timm_test_convnext.r160_in1k
    embedding_dim: 128
    torchaug_transforms: True

policy:
  class_name: RecurrentMLPModel
  project_image_encoder_latent: Fasle
  project_image_encoder_latent_dim: 32
  learning_rate: 1.e-5
  obs_key: policy
